[package]
name = "lifeguard-reflector"
version = "0.1.0"
edition = "2021"
license = "FSL-1.1-ALv2"
repository = "https://github.com/microscaler/lifeguard-reflector"
description = "LifeReflector: Postgres LISTEN/NOTIFY to Redis cache invalidation for Lifeguard entities"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lifereflector"
path = "src/main.rs"

[dependencies]
# Resolved through `[patch.crates-io]` below to the same `may` that may_redis uses: one scheduler
# for the whole process.
may = "0.3"
may_postgres = { git = "https://github.com/microscaler/may_postgres.git", rev = "15b4ab8d717ac92abe8472c2312900753c35e8e6" }
may-redis = { git = "https://github.com/microscaler/may_redis.git", rev = "549437503bd134fd6e6bd80099d9019153c72bce" }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
prometheus = { version = "0.14", default-features = false }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# One `may` for the whole process. `may_redis` builds on the microscaler fork's `master`
# (crates.io may 0.3.51 plus `spsc::Receiver::recv_with_timeout`); without this patch the graph
# holds two `may` crates and therefore two schedulers, and coroutines from one block the other's
# workers. Must name the same git URL and branch (`master`) as may_redis so Cargo sees one source. Drop when
# the API lands in a may release.
[patch.crates-io]
may = { git = "https://github.com/microscaler/may.git", branch = "master" }
