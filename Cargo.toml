[package]
name = "lifeguard-reflector"
version = "0.1.0"
edition = "2021"
license = "FSL-1.1-ALv2"
repository = "https://github.com/microscaler/lifeguard-reflector"
description = "LifeReflector: Postgres LISTEN/NOTIFY to Redis cache invalidation for Lifeguard entities"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lifereflector"
path = "src/main.rs"

[dependencies]
# Resolved through `[patch.crates-io]` below to the same `may` that may_redis uses: one scheduler
# for the whole process.
may = "0.3"
may_postgres = { git = "https://github.com/microscaler/may_postgres.git", branch = "integration/microscaler-fork" }
may-redis = { git = "https://github.com/microscaler/may_redis.git", rev = "5390b28309c87b4a9859f29eee473ea66468d448" }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
prometheus = { version = "0.14", default-features = false }
# op_duration_seconds{component="lifereflector",...}: the shared operation-timing family, appended to /metrics.
microscaler-timing = { git = "https://github.com/microscaler/microscaler-observability.git", branch = "main" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# One `may` for the whole process. may_redis (from 611620c; now 5390b28) depends on crates.io `may` and needs the microscaler
# fork's `spsc::Receiver::recv_with_timeout`, so every consumer patches crates.io `may` to the fork. With the same pinned
# rev in every consumer the graph holds one `may` and so one scheduler; move this rev in step with theirs. Drop when the
# API lands in a may release.
[patch.crates-io]
may = { git = "https://github.com/microscaler/may.git", rev = "2156e046291dfd568797f10630ffbc74694d33aa" }
