# https://pre-commit.com
# Install once: pip install pre-commit && pre-commit install
# Mirrors CI's lint job (.github/workflows/ci.yml). `always_run` keeps the hooks from being skipped
# when no staged path matches their implicit filters.

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy (CI parity, -D warnings, pedantic)
        entry: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic
        language: system
        pass_filenames: false
        always_run: true
